# GravityLAN Unraid Development Compose
# Forces local build and host networking for physical interface access.

services:
  gravitylan:
    build:
      context: .
      dockerfile: Dockerfile
    image: sleeperxr/gravitylan:latest
    container_name: GravityLAN
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./data:/app/data
    environment:
      # Unraid appdata belongs to nobody:users (99:100)
      - PUID=99
      - PGID=100
      - TZ=Europe/Berlin
      - GRAVITYLAN_DEBUG=false
      - GRAVITYLAN_PORT=8000
      # Manual agent install over plain HTTP without ALLOW_INSECURE=1 on the device (unencrypted)
      # - GRAVITYLAN_ALLOW_INSECURE_INSTALL=true
      # LAN IP of this server: SSH to it may retry over the Docker bridge gateway (macvlan)
      # - GRAVITYLAN_DOCKER_HOST_IP=192.168.1.10
