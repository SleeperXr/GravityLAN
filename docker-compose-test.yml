services:
  gravitylan:
    build: .
    container_name: GravityLAN_Test
    restart: unless-stopped
    network_mode: host
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 1
    volumes:
      - ./backend/app:/app/app
      - ./agent:/app/agent
      - ./static:/app/static
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # UID/GID the server runs as; on start the container hands ./data to this owner
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - GRAVITYLAN_PORT=8080
      - GRAVITYLAN_DATA_DIR=/app/data
      - TZ=Europe/Berlin
      - GRAVITYLAN_DEBUG=false
    cap_add:
      - NET_RAW
      - NET_ADMIN

# A file share for this stack is in docker-compose-test.smb.yml (opt-in, localhost only, own directory).
