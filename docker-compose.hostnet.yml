# Advanced Deployment: Host Networking
# Simplest LAN access for scans, but removes container isolation.
services:
  gravitylan:
    image: sleeperxr/gravitylan:latest
    container_name: GravityLAN_Host
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./data:/app/data
    environment:
      # UID/GID the server runs as; on start the container hands ./data to this owner
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - GRAVITYLAN_PORT=8000
      - TZ=UTC
