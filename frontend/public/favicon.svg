<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="planet" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#3b6fd0"/>
      <stop offset="0.55" stop-color="#1f428f"/>
      <stop offset="1" stop-color="#14275a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- cuts a clean gap into the planet where the ring passes in front -->
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <g transform="rotate(-25 256 256)">
        <path d="M481 270.6 A230 70 0 0 1 26 256" fill="none" stroke="#000" stroke-width="50"/>
      </g>
    </mask>
  </defs>

  <g transform="rotate(-25 256 256)">
    <!-- back half of the ring: the cable, ending in the RJ45 plug -->
    <path d="M26 256 A230 70 0 0 1 418.6 206.5" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"/>
  </g>

  <g mask="url(#cut)">
    <circle cx="256" cy="256" r="150" fill="url(#planet)"/>
    <path d="M256 106 A150 150 0 0 1 256 406 A120 150 0 0 0 256 106Z" fill="#0b1a3f" opacity="0.28"/>
  </g>

  <g transform="rotate(-25 256 256)">
    <!-- front half of the ring -->
    <path d="M481 270.6 A230 70 0 0 1 26 256" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"/>

    <!-- RJ45 plug as line art: boot, latch, body and contacts -->
    <g transform="translate(418.6 206.5) rotate(24)" fill="#14275a" stroke="#22d3ee" stroke-width="5" stroke-linejoin="round">
      <path d="M0 -12 L24 -15 V15 L0 12Z"/>
      <path d="M30 -19 L58 -28 L61 -19" fill="none"/>
      <rect x="24" y="-19" width="50" height="38" rx="6"/>
      <g stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round">
        <line x1="56" y1="-11" x2="67" y2="-11"/>
        <line x1="56" y1="-6.6" x2="67" y2="-6.6"/>
        <line x1="56" y1="-2.2" x2="67" y2="-2.2"/>
        <line x1="56" y1="2.2" x2="67" y2="2.2"/>
        <line x1="56" y1="6.6" x2="67" y2="6.6"/>
        <line x1="56" y1="11" x2="67" y2="11"/>
      </g>
    </g>
  </g>
</svg>
