services:
  gravitylan:
    image: sleeperxr/gravitylan:latest
    container_name: GravityLAN
    restart: unless-stopped
    ports:
      - "8000:8000"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Optional resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M
    volumes:
      - ./data:/app/data
    environment:
      # UID/GID the server runs as; on start the container hands ./data to this owner
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=UTC
      - GRAVITYLAN_DEBUG=false
      # Backup, restore and the database reset in Settings only work with the default SQLite
      # database in /app/data; with another GRAVITYLAN_DATABASE_URL they are refused
      # --- HTTPS and reverse proxy: leave commented while you open GravityLAN over plain HTTP ---
      # Mark the session cookie Secure. Only once GravityLAN is reached over https://,
      # otherwise the browser drops the cookie and the login does not stick
      # - GRAVITYLAN_SECURE_COOKIES=true
      # Addresses or networks of your reverse proxy, comma-separated. Only these may set the
      # client address with X-Forwarded-For, so the login limit, the audit log and agent IPs
      # see the real client instead of the proxy. Empty = only localhost is trusted
      # - GRAVITYLAN_TRUSTED_PROXIES=172.18.0.0/16
      # Only needed if the proxy rewrites the Host header and sends no X-Forwarded-Host:
      # the address you open GravityLAN with (JSON list). Otherwise WebSockets (live scan,
      # logs, metrics, terminal) refuse the page
      # - 'GRAVITYLAN_CORS_ORIGINS=["https://gravity.example.com"]'
