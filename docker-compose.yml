services:
  gravitylan:
    image: sleeperxr/gravitylan:latest
    container_name: GravityLAN
    restart: unless-stopped
    ports:
      - "8000:8000"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./data:/app/data
    environment:
      # UID/GID the server runs as; on start the container hands ./data to this owner
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=UTC
      - GRAVITYLAN_DEBUG=false
