name: GravityLAN CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # release.yml runs the whole CI before it publishes an image
  workflow_call:

permissions:
  contents: read

jobs:
  agent-version:
    # Every change in agent/ raises the agent VERSION (docs/RELEASING.md)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Agent changes raise the agent version
      env:
        BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      run: |
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          echo "No base commit to compare with."
          exit 0
        fi
        python scripts/check_agent_version.py "$BASE"

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-asyncio
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run tests
      env:
        GRAVITYLAN_DATA_DIR: /tmp/gravitylan_test_data
      run: |
        cd backend
        python -m pytest

    - name: Run Python client tests
      # The client has its own tests; installing it also checks that the package builds
      run: |
        pip install ./gravitylan_api
        python -m pytest gravitylan_api/tests

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'
        cache-dependency-path: frontend-vue/package-lock.json

    - name: GravityUI (Vue) typecheck, lint and tests
      run: |
        cd frontend-vue
        npm ci
        npm run typecheck
        npm run lint
        npm test

  e2e:
    # Browser smoke tests: setup wizard and sign-in against the demo backend (no scans, 127.0.0.1 only)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Backend dependencies for the demo server
      run: pip install -r backend/requirements.txt

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'
        cache-dependency-path: frontend-vue/package-lock.json

    - name: Playwright smoke tests
      working-directory: frontend-vue
      run: |
        npm ci
        npx playwright install --with-deps chromium
        npx playwright test

    - name: Keep the report of a failed run
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend-vue/playwright-report
        retention-days: 7

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag gravitylan:ci
