<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0f14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GravityLAN" />
    <link rel="icon" type="image/svg+xml" href="/frontend-vue/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/frontend-vue/apple-touch-icon.png" />
    <link rel="manifest" href="/frontend-vue/manifest.webmanifest" />
    <title>GravityLAN</title>
    <script>
      // Apply the stored theme before the first paint so light mode never flashes dark
      (function () {
        try {
          // The designs of src/lib/themes.ts; anything else falls back to the night theme
          var known = ['dark', 'starlight', 'aurora', 'light', 'paper'];
          var pref = localStorage.getItem('gravityui.theme') || 'dark';
          var theme = pref === 'system' ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : known.indexOf(pref) >= 0 ? pref : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
