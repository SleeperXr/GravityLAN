<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e0e11" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GravityLAN</title>
    <script>
      // Apply the stored theme before the first paint so light mode never flashes dark
      (function () {
        try {
          var pref = localStorage.getItem('gravityui.theme') || 'dark';
          var dark = pref === 'dark' || (pref === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
